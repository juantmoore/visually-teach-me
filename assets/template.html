<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!--
  VISUALLY TEACH ME TEMPLATE v1.0
  Shared dark-first, low-glare template for visually-teach-me lessons.
  scripts/build.py fills the TITLE, DESCRIPTION and DATA placeholders (double curly braces).
  Everything above the vtm:body marker goes in <head> for full HTML builds;
  everything below it goes in <body>.
-->
<style>
/* Low-glare dark mode by default (never pure black, never pure white).
   Light mode is opt-in via the theme toggle and saved in localStorage. */
:root{
  color-scheme:dark;
  --bg:#15171c;
  --surface:#1b1e25;
  --sunk:#222630;
  --line:#2d3340;
  --ink:#d9dde3;
  --muted:#9aa3b2;
  --faint:#6f7888;
  --accent:#6ea8b8;
  --good:#7ab88f;     --good-soft:#1d2c24;
  --bad:#cf7d74;      --bad-soft:#2e1f20;
  --warn:#cfa167;     --warn-soft:#2c2419;
  /* 6 muted, desaturated concept hues */
  --h-teal:#6ea8b8;   --h-teal-soft:#1b292e;
  --h-amber:#cfa167;  --h-amber-soft:#2c2419;
  --h-sage:#86b38e;   --h-sage-soft:#1d2b22;
  --h-rose:#c9859a;   --h-rose-soft:#2d1f26;
  --h-violet:#a395cf; --h-violet-soft:#242131;
  --h-slate:#8ea3be;  --h-slate-soft:#1e242e;
  --c:var(--accent);
  --soft:var(--sunk);
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f5f7;
  --surface:#ffffff;
  --sunk:#eaedf2;
  --line:#d5dbe3;
  --ink:#1e232c;
  --muted:#535d6c;
  --faint:#7a8596;
  --accent:#286b7d;
  --good:#2d6f49;     --good-soft:#e3f1e8;
  --bad:#a63d35;      --bad-soft:#f7e4e2;
  --warn:#94601b;     --warn-soft:#f6ebd9;
  --h-teal:#286b7d;   --h-teal-soft:#e0eff3;
  --h-amber:#94601b;  --h-amber-soft:#f6ebd9;
  --h-sage:#3c7046;   --h-sage-soft:#e3f0e5;
  --h-rose:#8f415b;   --h-rose-soft:#f4e3e9;
  --h-violet:#5c4b94; --h-violet-soft:#ebe7f6;
  --h-slate:#495f7a;  --h-slate-soft:#e5ebf2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:72px;
}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(2rem,4.8vw,3rem);font-weight:750}
h2{font-size:clamp(1.4rem,2.8vw,1.85rem);font-weight:700}
h3{font-size:1.12rem;font-weight:650}
code{
  font-family:var(--mono);
  font-size:.86em;
  background:var(--sunk);
  border:1px solid var(--line);
  padding:.08em .36em;
  border-radius:5px;
}
pre{
  margin:0;
  font-family:var(--mono);
  font-size:.86rem;
  line-height:1.5;
  background:var(--sunk);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 14px;
  overflow-x:auto;
  color:var(--ink);
}
.measure{max-width:68ch}
.eyebrow{
  font-family:var(--mono);
  font-size:.74rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  display:inline-block;
}
.err{padding:24px;color:var(--bad)}

/* Hue carriers */
.hue-teal{--c:var(--h-teal);--soft:var(--h-teal-soft)}
.hue-amber{--c:var(--h-amber);--soft:var(--h-amber-soft)}
.hue-sage{--c:var(--h-sage);--soft:var(--h-sage-soft)}
.hue-rose{--c:var(--h-rose);--soft:var(--h-rose-soft)}
.hue-violet{--c:var(--h-violet);--soft:var(--h-violet-soft)}
.hue-slate{--c:var(--h-slate);--soft:var(--h-slate-soft)}

/* Top sticky progress bar & "you are here" nav */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.progress-track{height:3px;background:var(--sunk);width:100%}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .18s ease}
.topbar-inner{
  max-width:920px;
  margin:0 auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between;
}
.where{
  font-family:var(--mono);
  font-size:.78rem;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.where strong{color:var(--ink);font-weight:600}
.theme-btn{
  font-family:var(--mono);
  font-size:.76rem;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 11px;
  cursor:pointer;
  flex:none;
}
.theme-btn:hover{color:var(--ink);border-color:var(--muted)}

/* Main container */
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* Hero */
header.hero{padding:44px 0 24px;display:flex;flex-direction:column;gap:16px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.pill{
  font-family:var(--mono);
  font-size:.76rem;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 10px;
}
.lede{font-size:1.1rem;color:var(--muted);max-width:64ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.chip{
  font-family:var(--mono);
  font-size:.78rem;
  padding:4px 11px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* Step nav ("On this page") */
nav.toc{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:14px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}
nav.toc a{
  font-size:.84rem;
  text-decoration:none;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:4px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:border-color .15s,color .15s,background .15s;
}
nav.toc a .num{font-family:var(--mono);font-size:.74rem;color:var(--faint)}
nav.toc a:hover{color:var(--ink);border-color:var(--muted)}
nav.toc a.active{
  color:var(--ink);
  border-color:var(--accent);
  background:var(--sunk);
}
nav.toc a.active .num{color:var(--accent)}

/* Sections */
section{
  padding:38px 0 6px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-margin-top:64px;
}
.sec-head{display:flex;flex-direction:column;gap:8px}
.sec-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-badge{
  font-family:var(--mono);
  font-size:.72rem;
  color:var(--muted);
  background:var(--sunk);
  border:1px solid var(--line);
  border-radius:6px;
  padding:2px 7px;
}
.intro{display:flex;flex-direction:column;gap:10px;color:var(--muted)}

/* TL;DR */
.tldr-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:12px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.tldr-box ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:10px}
.tldr-box li{max-width:66ch}

/* Master analogy */
.analogy-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.role-grid{display:grid;gap:10px}
.role-row{
  display:grid;
  grid-template-columns:minmax(0,150px) minmax(0,180px) minmax(0,1fr);
  gap:10px 16px;
  align-items:baseline;
  background:var(--sunk);
  border:1px solid var(--line);
  border-left:4px solid var(--c);
  border-radius:10px;
  padding:12px 14px;
}
.role-concept{font-family:var(--mono);font-size:.84rem;font-weight:600;color:var(--c)}
.role-name{font-weight:600;color:var(--ink)}
.role-why{font-size:.94rem;color:var(--muted)}
@media (max-width:680px){.role-row{grid-template-columns:1fr;gap:4px}}
.limits-note{
  font-size:.92rem;
  color:var(--muted);
  background:var(--sunk);
  border-radius:8px;
  padding:11px 14px;
  border-left:3px solid var(--warn);
}

/* Concept chunk card */
.concept-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-top:3px solid var(--c);
  border-radius:12px;
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.concept-card h2{color:var(--ink)}
.concept-tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-family:var(--mono);
  font-size:.75rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--c);
}
.mini-analogy{
  background:var(--soft);
  border:1px dashed var(--c);
  border-radius:9px;
  padding:11px 14px;
  font-size:.95rem;
}
.mini-analogy .eyebrow{color:var(--c);margin-right:8px}
.concept-body{display:flex;flex-direction:column;gap:12px}
.takeaway{
  background:var(--sunk);
  border-left:3px solid var(--c);
  border-radius:0 8px 8px 0;
  padding:10px 14px;
  font-size:.95rem;
}

/* Collapsible Go Deeper */
details.deeper{
  background:var(--sunk);
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 14px;
}
details.deeper summary{
  cursor:pointer;
  font-family:var(--mono);
  font-size:.84rem;
  color:var(--accent);
  font-weight:500;
  list-style:none;
  display:flex;
  align-items:center;
  gap:8px;
}
details.deeper summary::-webkit-details-marker{display:none}
details.deeper summary::before{content:"▸";display:inline-block;transition:transform .15s}
details.deeper[open] summary::before{transform:rotate(90deg)}
.deeper-body{margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:.95rem;color:var(--muted)}

/* Diagrams (Mermaid + inline SVG) */
figure.diagram-fig{
  margin:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.concept-card figure.diagram-fig,.buildup-step figure.diagram-fig{background:var(--bg)}
.diagram-stage{overflow-x:auto;display:flex;justify-content:center;align-items:center;min-height:60px}
.diagram-stage svg{max-width:100%;height:auto;display:block}
.diagram-fallback{
  width:100%;
  background:var(--sunk);
  border:1px dashed var(--line);
  border-radius:8px;
  padding:12px 14px;
  font-size:.92rem;
  color:var(--muted);
}
.diagram-fallback .fb-label{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);display:block;margin-bottom:4px}
figure.diagram-fig figcaption{
  font-size:.9rem;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding-top:10px;
}

/* Build it up */
.buildup-list{display:flex;flex-direction:column;gap:14px}
.buildup-step{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--c);
  border-radius:12px;
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.buildup-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.buildup-num{
  font-family:var(--mono);
  font-size:.78rem;
  font-weight:600;
  color:var(--c);
  background:var(--soft);
  border-radius:6px;
  padding:2px 8px;
}
.buildup-adds{
  font-family:var(--mono);
  font-size:.75rem;
  color:var(--muted);
  background:var(--sunk);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 9px;
}
.buildup-summary{
  background:var(--sunk);
  border-radius:10px;
  padding:14px 16px;
  font-size:.96rem;
}

/* Worked example */
.example-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.io-box{
  background:var(--sunk);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.io-box.out{border-left:4px solid var(--good)}
.io-box.in{border-left:4px solid var(--accent)}
.ex-steps{display:flex;flex-direction:column;gap:10px;padding-left:14px;border-left:2px solid var(--line)}
.ex-step{
  background:var(--bg);
  border:1px solid var(--line);
  border-left:3px solid var(--c);
  border-radius:9px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ex-step-label{font-weight:600;font-size:.96rem;color:var(--c)}
.token-row{display:flex;flex-wrap:wrap;gap:8px}
.token{
  display:inline-flex;
  flex-direction:column;
  gap:2px;
  background:var(--soft);
  border:1px solid var(--c);
  border-radius:8px;
  padding:6px 10px;
  font-family:var(--mono);
  font-size:.82rem;
  color:var(--ink);
}
.token .tlabel{font-size:.7rem;color:var(--muted);font-family:var(--sans)}

/* Compare table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{
  font-family:var(--mono);
  font-size:.78rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  background:var(--sunk);
  color:var(--muted);
}
thead th.has-hue{color:var(--c)}
tbody th{font-weight:600;width:24%;color:var(--ink)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}

/* Common confusions */
.conf-list{display:flex;flex-direction:column;gap:12px}
.conf-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
}
@media (max-width:680px){.conf-card{grid-template-columns:1fr}}
.conf-myth{background:var(--bad-soft);padding:14px 16px;border-right:1px solid var(--line)}
@media (max-width:680px){.conf-myth{border-right:0;border-bottom:1px solid var(--line)}}
.conf-myth .eyebrow{color:var(--bad);display:block;margin-bottom:4px}
.conf-real{padding:14px 16px}
.conf-real .eyebrow{color:var(--good);display:block;margin-bottom:4px}

/* Quick check & Final quiz */
.check-card,.quiz-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.check-card{border-left:4px solid var(--accent)}
.qtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.qprompt{font-size:1.08rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{
  font:inherit;
  font-size:.96rem;
  text-align:left;
  padding:11px 14px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  cursor:pointer;
  transition:border-color .15s,background .15s;
}
.opts button:hover:not(:disabled){border-color:var(--accent);background:var(--sunk)}
.opts button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts button:disabled{cursor:default}
.explain{background:var(--sunk);border-radius:9px;padding:12px 14px;font-size:.95rem}
.qnav{display:flex;justify-content:flex-end}
.qnav button{
  font:inherit;
  font-size:.92rem;
  font-weight:600;
  padding:8px 16px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:var(--sunk);
  color:var(--ink);
  cursor:pointer;
}
.qnav button:hover:not(:disabled){background:var(--accent);color:var(--bg)}
.qnav button:disabled{opacity:.4;cursor:default}

/* Glossary */
.gloss-list{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 20px;
  margin:0;
}
.gloss-row{
  display:grid;
  grid-template-columns:minmax(0,11em) minmax(0,1fr);
  gap:8px 16px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.gloss-row:last-child{border-bottom:0}
.gloss-row dt{font-family:var(--mono);font-size:.88rem;font-weight:600;color:var(--c)}
.gloss-row dd{margin:0;font-size:.96rem;color:var(--muted)}
@media (max-width:560px){.gloss-row{grid-template-columns:1fr;gap:3px}}

/* Recap */
.recap-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--good);
  border-radius:12px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.recap-card ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:8px}
.next-steps{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:.94rem;color:var(--muted)}

/* Prose callout */
.callout{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--faint);
  border-radius:0 10px 10px 0;
  padding:13px 16px;
  font-size:.96rem;
}
.callout.tone-good{border-left-color:var(--good);background:var(--good-soft)}
.callout.tone-warn{border-left-color:var(--warn);background:var(--warn-soft)}

/* Sources + Footer */
.sources ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:7px;font-size:.93rem;color:var(--muted)}
.sources .asof{font-family:var(--mono);font-size:.78rem;color:var(--faint);margin-left:6px}
footer{
  margin-top:44px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:.85rem;
  color:var(--faint);
  display:flex;
  flex-direction:column;
  gap:4px;
}
</style>
<!-- vtm:body -->
<div class="topbar" id="topbar">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="topbar-inner">
    <div class="where" id="where-label">Loading lesson...</div>
    <button type="button" class="theme-btn" id="theme-toggle" aria-label="Switch color theme">Light mode</button>
  </div>
</div>
<main class="wrap" id="lesson"></main>
<noscript><p class="err">This lesson needs JavaScript to display.</p></noscript>

<script type="application/json" id="lesson-data">{{DATA}}</script>
<script>
(function(){
  "use strict";
  var TEMPLATE_VERSION = "1.0";
  var HUES = ["teal","amber","sage","rose","violet","slate"];
  var root = document.getElementById("lesson");
  var themeBtn = document.getElementById("theme-toggle");

  /* Theme: dark is ALWAYS the default regardless of OS setting. */
  function getTheme(){
    try { return localStorage.getItem("vtm-theme") === "light" ? "light" : "dark"; }
    catch(e){ return "dark"; }
  }
  function applyTheme(t){
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = t === "light" ? "Dark mode" : "Light mode";
    try { localStorage.setItem("vtm-theme", t); } catch(e){}
    if (typeof window.__vtmRenderMermaid === "function") window.__vtmRenderMermaid(t);
  }
  applyTheme(getTheme());
  themeBtn.addEventListener("click", function(){
    applyTheme(getTheme() === "light" ? "dark" : "light");
  });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function md(s){
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return out;
  }
  function list(x){ return x == null ? [] : (Array.isArray(x) ? x : [x]); }
  function paras(x, cls){
    return list(x).map(function(p){ return '<p class="' + (cls || "measure") + '">' + md(p) + "</p>"; }).join("");
  }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9-]/g, "-"); }
  function hueCls(h){ return h && HUES.indexOf(h) >= 0 ? "hue-" + h : ""; }

  var L;
  try { L = JSON.parse(document.getElementById("lesson-data").textContent); }
  catch(e){ root.innerHTML = '<p class="err">Lesson data could not be read: ' + esc(e.message) + "</p>"; return; }

  var mermaidJobs = [];
  window.__vtmMermaidJobs = mermaidJobs;

  function renderDiagram(d, key){
    if (!d) return "";
    var inner = "";
    if (d.mermaid){
      var mid = "mmd-" + key;
      mermaidJobs.push({ id: mid, code: d.mermaid });
      inner = '<div class="diagram-stage" id="' + mid + '">' +
        '<div class="diagram-fallback"><span class="fb-label">Diagram description</span>' + md(d.alt) + "</div></div>";
    } else if (d.svg){
      inner = '<div class="diagram-stage" role="img" aria-label="' + esc(d.alt || d.caption || "Diagram") + '">' + d.svg + "</div>";
    }
    return '<figure class="diagram-fig">' + inner + '<figcaption>' + md(d.caption) + "</figcaption></figure>";
  }

  function renderDeeper(d){
    if (!d) return "";
    return '<details class="deeper"><summary>' + md(d.summary || "Go deeper") +
      '</summary><div class="deeper-body">' + paras(d.body) + "</div></details>";
  }

  function head(s, stepLabel){
    var h = '<div class="sec-head">';
    if (stepLabel || s.eyebrow){
      h += '<div class="sec-top">';
      if (stepLabel) h += '<span class="step-badge">' + esc(stepLabel) + "</span>";
      if (s.eyebrow) h += '<span class="eyebrow">' + md(s.eyebrow) + "</span>";
      h += "</div>";
    }
    if (s.title) h += "<h2>" + md(s.title) + "</h2>";
    if (s.intro) h += '<div class="intro">' + paras(s.intro) + "</div>";
    return h + "</div>";
  }

  var R = {};

  R.tldr = function(s, sid, stepLabel){
    return head(s, stepLabel) + '<div class="tldr-box"><ul>' +
      list(s.bullets).map(function(b){ return "<li>" + md(b) + "</li>"; }).join("") +
      "</ul></div>";
  };

  R.analogy = function(s, sid, stepLabel){
    var h = head(s, stepLabel) + '<div class="analogy-card">' + paras(s.premise) + '<div class="role-grid">';
    h += list(s.roles).map(function(r){
      return '<div class="role-row ' + hueCls(r.hue) + '"><div class="role-concept">' + md(r.concept) +
        '</div><div class="role-name">' + md(r.role) + '</div><div class="role-why">' + md(r.why) + "</div></div>";
    }).join("") + "</div>";
    if (s.limits) h += '<div class="limits-note"><strong>Where the analogy stops:</strong> ' + md(s.limits) + "</div>";
    return h + "</div>";
  };

  R.concept = function(s, sid, stepLabel){
    var h = '<article class="concept-card ' + hueCls(s.hue) + '">';
    h += '<div class="sec-top">';
    if (stepLabel) h += '<span class="step-badge">' + esc(stepLabel) + "</span>";
    if (s.eyebrow) h += '<span class="concept-tag"><span class="dot"></span>' + md(s.eyebrow) + "</span>";
    h += "</div>";
    h += "<h2>" + md(s.title) + "</h2>";
    if (s.analogy) h += '<div class="mini-analogy"><span class="eyebrow">Analogy</span>' + md(s.analogy) + "</div>";
    h += '<div class="concept-body">' + paras(s.body) + "</div>";
    if (s.diagram) h += renderDiagram(s.diagram, sid + "-d");
    if (s.takeaway) h += '<div class="takeaway"><strong>Key idea:</strong> ' + md(s.takeaway) + "</div>";
    if (s.deeper) h += renderDeeper(s.deeper);
    return h + "</article>";
  };

  R.diagram = function(s, sid, stepLabel){
    return head(s, stepLabel) +
      '<div class="' + hueCls(s.hue) + '">' + renderDiagram(s, sid + "-d") + "</div>" +
      renderDeeper(s.deeper);
  };

  R.buildup = function(s, sid, stepLabel){
    var h = head(s, stepLabel) + '<div class="buildup-list">';
    h += list(s.steps).map(function(st, idx){
      var sh = '<div class="buildup-step ' + hueCls(st.hue) + '"><div class="buildup-head">' +
        '<span class="buildup-num">Part ' + (idx + 1) + "</span><h3>" + md(st.title) + "</h3>";
      if (st.adds) sh += '<span class="buildup-adds">+ ' + md(st.adds) + "</span>";
      sh += "</div>" + paras(st.body);
      if (st.diagram) sh += renderDiagram(st.diagram, sid + "-st" + idx);
      return sh + "</div>";
    }).join("") + "</div>";
    if (s.summary) h += '<div class="buildup-summary measure">' + md(s.summary) + "</div>";
    return h;
  };

  function ioBlock(val, defaultLabel, kind){
    if (typeof val === "string"){
      return '<div class="io-box ' + kind + '"><span class="eyebrow">' + esc(defaultLabel) + "</span><p>" + md(val) + "</p></div>";
    }
    var inner = val.code ? "<pre>" + esc(val.value) + "</pre>" : "<p>" + md(val.value) + "</p>";
    return '<div class="io-box ' + kind + '"><span class="eyebrow">' + md(val.label || defaultLabel) + "</span>" + inner + "</div>";
  }
  R.example = function(s, sid, stepLabel){
    var h = head(s, stepLabel) + '<div class="example-card">';
    h += ioBlock(s.input, "Input", "in");
    h += '<div class="ex-steps">' + list(s.steps).map(function(st){
      var sh = '<div class="ex-step ' + hueCls(st.hue) + '"><div class="ex-step-label">' + md(st.label) + "</div>" +
        '<p class="measure">' + md(st.detail) + "</p>";
      if (st.code) sh += "<pre>" + esc(st.code) + "</pre>";
      if (st.tokens && st.tokens.length){
        sh += '<div class="token-row">' + list(st.tokens).map(function(tok){
          if (typeof tok === "string") return '<span class="token">' + esc(tok) + "</span>";
          return '<span class="token ' + hueCls(tok.hue || st.hue) + '"><span>' + esc(tok.text) + "</span>" +
            (tok.label ? '<span class="tlabel">' + md(tok.label) + "</span>" : "") + "</span>";
        }).join("") + "</div>";
      }
      return sh + "</div>";
    }).join("") + "</div>";
    h += ioBlock(s.output, "Output", "out");
    if (s.deeper) h += renderDeeper(s.deeper);
    return h + "</div>";
  };

  R.compare = function(s, sid, stepLabel){
    var cols = list(s.columns);
    var h = head(s, stepLabel) + '<div class="tablewrap"><table><thead><tr><th></th>' + cols.map(function(c){
      if (typeof c === "string") return "<th>" + md(c) + "</th>";
      var hc = hueCls(c.hue);
      return '<th class="' + (hc ? hc + " has-hue" : "") + '">' + md(c.label) + "</th>";
    }).join("") + "</tr></thead><tbody>";
    h += list(s.rows).map(function(r){
      return "<tr><th>" + md(r.label) + "</th>" + list(r.cells).map(function(c){ return "<td>" + md(c) + "</td>"; }).join("") + "</tr>";
    }).join("");
    return h + "</tbody></table></div>";
  };

  R.confusions = function(s, sid, stepLabel){
    return head(s, stepLabel) + '<div class="conf-list">' + list(s.items).map(function(it){
      return '<div class="conf-card"><div class="conf-myth"><span class="eyebrow">Common myth</span><p>' + md(it.myth) +
        '</p></div><div class="conf-real"><span class="eyebrow">What actually happens</span><p>' + md(it.reality) + "</p></div></div>";
    }).join("") + "</div>";
  };

  R.check = function(s, sid){
    return '<div class="check-card"><span class="eyebrow">' + md(s.eyebrow || "Quick check") + "</span>" +
      (s.title ? "<h3>" + md(s.title) + "</h3>" : "") +
      '<div class="qprompt">' + md(s.prompt) + '</div><div class="opts"></div><div class="explain" hidden></div></div>';
  };
  function wireCheck(sec, s, sid){
    var O = sec.querySelector(".opts"), E = sec.querySelector(".explain");
    list(s.options).forEach(function(opt, idx){
      var b = document.createElement("button");
      b.type = "button";
      b.id = sid + "-o" + idx;
      b.innerHTML = md(opt);
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(O.querySelectorAll("button"), function(x, k){
          x.disabled = true;
          if (k === s.answer) x.classList.add("right");
        });
        if (idx === s.answer){
          E.innerHTML = "<strong>Right.</strong> " + md(s.explain);
        } else {
          b.classList.add("wrong");
          E.innerHTML = "<strong>Not quite.</strong> " + md(s.explain);
        }
        E.hidden = false;
      });
      O.appendChild(b);
    });
  }

  R.glossary = function(s, sid, stepLabel){
    return head(s, stepLabel) + '<dl class="gloss-list">' + list(s.terms).map(function(t){
      return '<div class="gloss-row ' + hueCls(t.hue) + '"><dt>' + md(t.term) + "</dt><dd>" + md(t.definition) + "</dd></div>";
    }).join("") + "</dl>";
  };

  R.quiz = function(s, sid, stepLabel){
    return head(s, stepLabel) + '<div class="quiz-card"><div class="qtop"><span class="eyebrow qcount"></span><span class="eyebrow qscore"></span></div>' +
      '<div class="qprompt" aria-live="polite"></div><div class="opts"></div><div class="explain" hidden></div>' +
      '<div class="qnav"><button type="button" class="qnext" id="' + sid + '-next" disabled>Next question</button></div></div>';
  };
  function wireQuiz(sec, s, sid){
    var Q = list(s.questions), i = 0, score = 0;
    var P = sec.querySelector(".qprompt"), O = sec.querySelector(".opts"), E = sec.querySelector(".explain"),
        N = sec.querySelector(".qnext"), C = sec.querySelector(".qcount"), S = sec.querySelector(".qscore");
    function show(){
      if (i >= Q.length){
        C.textContent = "Complete";
        P.textContent = "You scored " + score + " of " + Q.length + ".";
        O.innerHTML = "";
        E.hidden = false;
        E.textContent = score === Q.length ? "Every single one. You have the mental model down." : "Jump back to any section you missed using the bar above, then try again.";
        N.textContent = "Try again";
        N.disabled = false;
        return;
      }
      var q = Q[i];
      C.textContent = "Question " + (i + 1) + " of " + Q.length;
      S.textContent = "Score " + score;
      P.innerHTML = md(q.prompt);
      E.hidden = true;
      N.disabled = true;
      N.textContent = i === Q.length - 1 ? "See score" : "Next question";
      O.innerHTML = "";
      list(q.options).forEach(function(opt, idx){
        var b = document.createElement("button");
        b.type = "button";
        b.id = sid + "-q" + i + "o" + idx;
        b.innerHTML = md(opt);
        b.addEventListener("click", function(){
          Array.prototype.forEach.call(O.querySelectorAll("button"), function(x, k){
            x.disabled = true;
            if (k === q.answer) x.classList.add("right");
          });
          if (idx === q.answer){
            score++;
            E.innerHTML = "<strong>Right.</strong> " + md(q.explain);
          } else {
            b.classList.add("wrong");
            E.innerHTML = "<strong>Not quite.</strong> " + md(q.explain);
          }
          S.textContent = "Score " + score;
          E.hidden = false;
          N.disabled = false;
        });
        O.appendChild(b);
      });
    }
    N.addEventListener("click", function(){
      if (i >= Q.length){ i = 0; score = 0; } else { i++; }
      show();
    });
    show();
  }

  R.recap = function(s, sid, stepLabel){
    var h = head(s, stepLabel) + '<div class="recap-card"><ul>' +
      list(s.points).map(function(p){ return "<li>" + md(p) + "</li>"; }).join("") + "</ul>";
    if (s.nextSteps && s.nextSteps.length){
      h += '<div class="next-steps"><span class="eyebrow">Try this next</span><ul>' +
        list(s.nextSteps).map(function(n){ return "<li>" + md(n) + "</li>"; }).join("") + "</ul></div>";
    }
    return h + "</div>";
  };

  R.prose = function(s, sid, stepLabel){
    var h = head(s, stepLabel) + paras(s.body);
    if (s.callout) h += '<div class="callout tone-' + esc(s.callout.tone || "neutral") + '">' + md(s.callout.text) + "</div>";
    if (s.deeper) h += renderDeeper(s.deeper);
    return h;
  };

  /* Assemble page */
  var m = L.meta || {}, hero = L.hero || {};
  var out = '<header class="hero"><div class="hero-meta"><span class="eyebrow">' + md(m.eyebrow) + "</span>";
  if (m.readingTime) out += '<span class="pill">' + md(m.readingTime) + " read</span>";
  out += "</div><h1>" + md(hero.headline || m.title) + "</h1>";
  if (hero.lede) out += '<p class="lede">' + md(hero.lede) + "</p>";
  if (hero.chips && hero.chips.length){
    out += '<div class="chips" aria-label="Concept colors">' + list(hero.chips).map(function(c){
      return '<span class="chip ' + hueCls(c.hue) + '"><span class="dot"></span>' + md(c.label) + "</span>";
    }).join("") + "</div>";
  }
  out += "</header>";

  var stepNum = 0;
  var secs = list(L.sections).map(function(s, i){
    var hasStep = !!s.nav;
    if (hasStep) stepNum++;
    return { s: s, id: slug(s.id || (s.type + "-" + (i + 1))), step: hasStep ? stepNum : 0 };
  });
  var totalSteps = stepNum;

  var navItems = secs.filter(function(x){ return x.s.nav; });
  if (navItems.length){
    out += '<nav class="toc" aria-label="Lesson steps">' + navItems.map(function(x){
      return '<a href="#' + x.id + '" data-target="' + x.id + '"><span class="num">' + x.step + "</span>" + md(x.s.nav) + "</a>";
    }).join("") + "</nav>";
  }

  secs.forEach(function(x){
    var fn = R[x.s.type];
    var stepLabel = x.step ? ("Step " + x.step + " of " + totalSteps) : "";
    out += '<section id="' + x.id + '" data-step="' + x.step + '" data-nav="' + esc(x.s.nav || x.s.title || "") + '">' +
      (fn ? fn(x.s, x.id, stepLabel) : '<p class="err">Unknown section type: ' + esc(x.s.type) + "</p>") + "</section>";
  });

  if (list(L.sources).length){
    out += '<section class="sources" id="sources"><span class="eyebrow">Sources</span><ol>' + list(L.sources).map(function(src){
      return '<li><a href="' + esc(src.url) + '" target="_blank" rel="noopener">' + md(src.title) + "</a>" +
        (src.asOf ? '<span class="asof">as of ' + esc(src.asOf) + "</span>" : "") + "</li>";
    }).join("") + "</ol></section>";
  }

  function niceDate(s){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!p) return esc(s);
    return new Date(+p[1], +p[2] - 1, +p[3]).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  }
  out += "<footer><span>" + (m.researched ? "Checked " + niceDate(m.researched) + ". " : "") + md(m.footer || "") + "</span>" +
    "<span>Visually Teach Me template v" + TEMPLATE_VERSION + "</span></footer>";
  root.innerHTML = out;

  /* Wire interactive widgets */
  secs.forEach(function(x){
    var el = document.getElementById(x.id);
    if (x.s.type === "check") wireCheck(el, x.s, x.id);
    if (x.s.type === "quiz") wireQuiz(el, x.s, x.id);
  });

  /* "You are here" progress tracker */
  var whereEl = document.getElementById("where-label");
  var fillEl = document.getElementById("progress-fill");
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll("nav.toc a"));
  var tracked = navItems.map(function(x){ return { id: x.id, step: x.step, label: x.s.nav, el: document.getElementById(x.id) }; });

  function setWhere(item){
    if (!item){ whereEl.innerHTML = "<strong>" + esc(m.title || "Lesson") + "</strong>"; return; }
    whereEl.innerHTML = "Step " + item.step + " of " + totalSteps + " &middot; <strong>" + esc(item.label) + "</strong>";
    tocLinks.forEach(function(a){ a.classList.toggle("active", a.dataset.target === item.id); });
  }
  setWhere(tracked[0]);

  if ("IntersectionObserver" in window && tracked.length){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          var match = tracked.filter(function(t){ return t.id === en.target.id; })[0];
          if (match) setWhere(match);
        }
      });
    }, { rootMargin: "-20% 0px -65% 0px", threshold: 0 });
    tracked.forEach(function(t){ if (t.el) io.observe(t.el); });
  }

  function updateProgress(){
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
    fillEl.style.width = pct.toFixed(1) + "%";
  }
  window.addEventListener("scroll", updateProgress, { passive: true });
  updateProgress();
})();
</script>
<script type="module">
const jobs = window.__vtmMermaidJobs || [];
if (jobs.length) {
  let mermaidMod = null;
  let renderSeq = 0;

  function mermaidConfig(theme) {
    if (theme === "light") {
      return {
        startOnLoad: false,
        theme: "base",
        securityLevel: "strict",
        themeVariables: {
          background: "#ffffff",
          primaryColor: "#e0eff3",
          primaryTextColor: "#1e232c",
          primaryBorderColor: "#286b7d",
          secondaryColor: "#ebe7f6",
          tertiaryColor: "#f6ebd9",
          lineColor: "#535d6c",
          textColor: "#1e232c",
          actorBkg: "#eaedf2",
          actorBorder: "#286b7d",
          actorTextColor: "#1e232c",
          signalColor: "#535d6c",
          signalTextColor: "#1e232c",
          noteBkgColor: "#f6ebd9",
          noteBorderColor: "#94601b",
          noteTextColor: "#1e232c",
          fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        }
      };
    }
    return {
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      themeVariables: {
        background: "#1b1e25",
        primaryColor: "#222630",
        primaryTextColor: "#d9dde3",
        primaryBorderColor: "#6ea8b8",
        secondaryColor: "#242131",
        tertiaryColor: "#2c2419",
        lineColor: "#8ea3be",
        textColor: "#d9dde3",
        actorBkg: "#222630",
        actorBorder: "#6ea8b8",
        actorTextColor: "#d9dde3",
        signalColor: "#9aa3b2",
        signalTextColor: "#d9dde3",
        noteBkgColor: "#2c2419",
        noteBorderColor: "#cfa167",
        noteTextColor: "#d9dde3",
        fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      }
    };
  }

  async function renderAll(theme) {
    if (!mermaidMod) return;
    mermaidMod.initialize(mermaidConfig(theme));
    renderSeq++;
    for (const job of jobs) {
      const host = document.getElementById(job.id);
      if (!host) continue;
      try {
        const { svg } = await mermaidMod.render(job.id + "-svg-" + renderSeq, job.code);
        host.innerHTML = svg;
      } catch (err) {
        /* Leave text fallback in place if diagram syntax fails */
      }
    }
  }

  window.__vtmRenderMermaid = (theme) => { renderAll(theme); };

  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    mermaidMod = mod.default || mod;
    const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    await renderAll(current);
  } catch (err) {
    /* Offline or CDN unavailable: text fallback stays visible automatically. */
  }
}
</script>
